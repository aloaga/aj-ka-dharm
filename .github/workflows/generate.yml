name: Generate Daily Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install requests pillow

      - name: Generate dashboard
        env:
          NAVAMSHA_API_KEY: ${{ secrets.NAVAMSHA_API_KEY }}
        run: |
          python generator/generate_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.bin
          git diff --cached --quiet || git commit -m "Update daily dashboard"
          git push
