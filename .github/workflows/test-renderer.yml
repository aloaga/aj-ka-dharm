name: Test Calendar Renderer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install requests pillow

      - name: Generate calendar data
        env:
          NAVAMSHA_API_KEY: ${{ secrets.NAVAMSHA_API_KEY }}
          TATHAASTU_API_KEY: ${{ secrets.TATHAASTU_API_KEY }}
        run: |
          python generator/generate_calendar.py

      - name: Render today's calendar
        env:
          CALENDAR_INPUT_FILE: calendar_data_today.json
          CALENDAR_OUTPUT_FILE: dashboard_today.bin
        run: |
          python generator/render_calendar.py

      - name: Render tomorrow's calendar
        env:
          CALENDAR_INPUT_FILE: calendar_data.json
          CALENDAR_OUTPUT_FILE: dashboard_tomorrow.bin
        run: |
          python generator/render_calendar.py

      - name: Rename calendar bitmaps
        run: |
          cp dashboard_today.bin calendar_today.bin
          cp dashboard_tomorrow.bin calendar.bin

      - name: Verify calendar bitmaps
        run: |
          python - <<'PY'
          import os

          expected = 800 * 480 // 8

          files = [
              "calendar_today.bin",
              "calendar.bin",
          ]

          for filename in files:
              actual = os.path.getsize(filename)

              print(f"{filename}: {actual} bytes")
              print(f"Expected: {expected} bytes")

              if actual != expected:
                  raise SystemExit(
                      f"ERROR: {filename} has {actual} bytes; "
                      f"expected {expected}"
                  )

          print("Both calendar bitmaps have the correct size.")
          PY

      - name: Create preview PNGs
        run: |
          python - <<'PY'
          from PIL import Image

          width = 800
          height = 480
          expected = width * height // 8

          previews = [
              ("calendar_today.bin", "calendar-today-preview.png"),
              ("calendar.bin", "calendar-preview.png"),
          ]

          for input_file, output_file in previews:
              with open(input_file, "rb") as f:
                  raw = f.read()

              if len(raw) != expected:
                  raise SystemExit(
                      f"Invalid bitmap size for {input_file}: "
                      f"{len(raw)} bytes"
                  )

              image = Image.frombytes("1", (width, height), raw)
              image.save(output_file)

              print(f"Created {output_file}")
          PY

      - name: Commit calendar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            calendar.bin \
            calendar_today.bin \
            calendar_data.json \
            calendar_data_today.json

          git diff --cached --quiet || git commit -m "Update calendar"

          git push

      - name: Upload calendar previews
        uses: actions/upload-artifact@v4
        with:
          name: calendar-dashboard-preview
          path: |
            calendar_today.bin
            calendar.bin
            calendar-today-preview.png
            calendar-preview.png
