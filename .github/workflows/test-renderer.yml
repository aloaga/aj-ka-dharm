name: Test Calendar Renderer

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install requests pillow

      - name: Generate calendar data
        env:
          NAVAMSHA_API_KEY: ${{ secrets.NAVAMSHA_API_KEY }}
        run: |
          python generator/generate_calendar.py

      - name: Render calendar
        run: |
          python generator/render_calendar.py

      - name: Rename calendar bitmap
        run: |
          cp dashboard.bin calendar.bin

      - name: Verify calendar bitmap
        run: |
          python - <<'PY'
          import os

          filename = "calendar.bin"
          expected = 800 * 480 // 8
          actual = os.path.getsize(filename)

          print(f"Calendar bitmap size: {actual} bytes")
          print(f"Expected:             {expected} bytes")

          if actual != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} bytes, got {actual}"
              )

          print("Calendar bitmap size is correct.")
          PY

      - name: Create preview PNG
        run: |
          python - <<'PY'
          from PIL import Image

          width = 800
          height = 480

          with open("calendar.bin", "rb") as f:
              raw = f.read()

          expected = width * height // 8

          if len(raw) != expected:
              raise SystemExit(
                  f"Invalid bitmap size: {len(raw)} bytes"
              )

          image = Image.frombytes("1", (width, height), raw)
          image.save("calendar-preview.png")

          print("Created calendar-preview.png")
          PY

      - name: Commit calendar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.bin calendar_data.json

          git diff --cached --quiet || git commit -m "Update calendar"

          git push

      - name: Upload calendar preview
        uses: actions/upload-artifact@v4
        with:
          name: calendar-dashboard-preview
          path: |
            calendar.bin
            calendar-preview.png
