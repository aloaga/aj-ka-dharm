name: Test Calendar Renderer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install requests pillow

      - name: Generate calendar data
        env:
          NAVAMSHA_API_KEY: ${{ secrets.NAVAMSHA_API_KEY }}
        run: |
          python generator/generate_calendar.py

      - name: Render calendar
        run: |
          python generator/render_calendar.py

      - name: Verify bitmap
        run: |
          python - <<'PY'
          import os

          filename = "dashboard.bin"
          expected = 800 * 480 // 8
          actual = os.path.getsize(filename)

          print(f"Bitmap size: {actual} bytes")
          print(f"Expected:    {expected} bytes")

          if actual != expected:
              raise SystemExit(
                  f"ERROR: Expected {expected} bytes, got {actual}"
              )

          print("Bitmap size is correct.")
          PY

      - name: Upload generated bitmap
        uses: actions/upload-artifact@v4
        with:
          name: calendar-dashboard-test
          path: dashboard.bin
